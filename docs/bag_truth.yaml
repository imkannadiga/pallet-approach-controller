# Board bags (flat board, not a pallet). evaluate_bags.py does not read these:
# there is no `board` side in params.yaml, and the board's width is not
# recorded. NOTE the angle bags here use the OPPOSITE sign to the pallet bags
# (p10deg has dL < dR), and dL - dR over the nominal angle gives a board width
# of ~1.0 m at 10 deg but ~0.72 m at 20 deg, so the angle labels are nominal.
deck_80:          {side: board, dL: 0.800, dR: 0.800, lat: 0.0, measured: true}
deck_105:         {side: board, dL: 1.050, dR: 1.050, lat: 0.0, measured: true}
