# Tape-measured ground truth per bag, read by tools/evaluate_bags.py.
#
# Measure as docs/dataset.md, "Four tape readings per bag", at the robot, before
# moving anything:
#   dL, dR  bumper line to the pallet's LEFT / RIGHT front corner, metres,
#           perpendicular to the bumper (a straightedge on the bumper face)
#   lat     sideways offset of the face centre from the bumper centre, metres,
#           positive = pallet to the LEFT
#   side    short | long (which face points at the robot)
#   measured  false when the numbers are the TARGET a bag was recorded to, not
#           a tape reading. The evaluator reports those but flags them, and
#           they must not be quoted as accuracy (CLAUDE.md, hard rule 6).
#   light   free text: the lighting condition, for comparing bags
#
# Template for a new bag:
#   pallet_s_205_lights_on:
#     side: short
#     dL: 2.051
#     dR: 2.049
#     lat: 0.012
#     light: ceiling lights on, blinds open
#     measured: true

# 2026-10-27 lab session, tape readings by Athreya. Each reading is good to
# about 1 cm, so a yaw from dL - dR is good to about 1-1.4 deg on the short face
# (two readings over 0.795 m) and about 1 deg on the long one. Agreement between
# sensors finer than that cannot be scored against these. `lat` was only taken
# for the two _lat_ bags; elsewhere it is 0 by setup, not by tape.
pallet_s_305:           {side: short, dL: 3.050, dR: 3.050, lat: +0.00, light: normal, measured: true}
pallet_s_255:           {side: short, dL: 2.550, dR: 2.550, lat: +0.00, light: normal, measured: true}
