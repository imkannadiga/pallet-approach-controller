# Pallet approach: every tunable value lives here. Nothing is hard-coded in the
# source. Measured values are marked [measured] with their origin; values that are
# a choice are marked [choice] with the reasoning. See docs/SYSTEM.md.

# ---------------------------------------------------------------------------
# Shared by every node in the stack.
# ---------------------------------------------------------------------------
/**:
  ros__parameters:

    use_sim_time: false

    # [measured 2026-10-14] Where the real floor is in frames.ground. NOT zero:
    # the URDF's base_footprint joint is 25 mm out (its wheel geometry is right
    # to 0.2 mm). Shared, because three nodes need the same number -- the
    # overlay builds the robot-fixed forks against it (D29), the tracker uses it
    # as a fallback floor when perception has not fitted one, and the insertion
    # controller measures the LiDAR window from it. Perception's
    # floor.expected_z is the same measurement; test_params.py checks they
    # agree.
    floor_z: -0.025

    # [measured 2026-10-14, D23] The robot itself. Tape against the URDF:
    # 0.920 m long (URDF 0.925), 0.690 m wide over the wheels (0.6996). The
    # URDF's base_link collision box is accurate, unlike its base_footprint
    # joint, so the URDF values are kept -- they are the conservative ones and
    # every clearance in D16 and D21 rests on the front overhang.
    robot:
      length: 0.925
      width: 0.6996
      front_bumper_x: 0.4625
      rear_bumper_x: -0.4625

    # [derived, D16] Face distance at which base_footprint stops before
    # insertion. Shared because four stages read it: the closing loop drives to
    # it, GO/NO-GO measures tolerances at it, insertion starts from it and the
    # overlay marks it. It is NOT a perception choice -- it is set by how far
    # the virtual tine tips reach (forks.carriage_x + forks.tine_length =
    # 1.6125 m), because the tines must start outside the pallet. 1.75 m leaves
    # them 0.1375 m clear. The full derivation, including why the camera no
    # longer binds, is in docs/decisions.md D16.
    #
    # Measured at this distance on 2026-10-15 (pallet_s_129): face x +5 mm,
    # both pockets found, spacing -3 mm. See docs/dataset.md.
    standoff_distance: 1.75

    # ------------------------------------------------------------- closing
    # The servo that replaced the two-leg approach (D38). Two nested loops:
    # the outer one turns a lateral offset into an aim, the inner one turns the
    # robot to that aim. Both gains were chosen by simulating this controller
    # (test/simulate.py, test_closing.py), not by guessing.
    closing:
      # [measured] 1 / k_cross is the decay length of the lateral error in
      # metres, so 2.5 means the offset falls by e every 0.40 m travelled. This
      # is the number required_run_up is built on.
      k_cross: 2.5
      # [measured] How hard the robot chases the aim it has chosen, rad/s per
      # rad. It also sets the fine authority available: a command below
      # limits.min_angular is zeroed rather than raised, so the smallest
      # correction the base will make is min_angular / k_heading = 0.025 rad,
      # 1.4 deg. 4.0 rather than the 6.0 that simulated slightly better,
      # because the simulation has no actuator lag and the gentler gain is the
      # one that survives having some.
      k_heading: 4.0
      # [choice] The furthest the robot will crab across towards the line,
      # radians. 14.3 deg. Without a cap a large offset asks for an aim the
      # base reaches by turning most of the way sideways, and the pallet then
      # leaves the camera's view -- the servo would blind itself.
      max_approach_angle: 0.25
      # [choice] Inside this the aim is exactly zero, so the robot straightens
      # and arrives square rather than still cutting across. Without it the
      # arrival yaw is determined by the arrival offset (aim = k_cross *
      # offset), and at k_cross 2.5 a 35 mm residual is already the whole 5 deg
      # GO/NO-GO yaw budget. 15 mm is above the ~10 mm measurement noise, so
      # the aim does not chatter across the edge.
      straighten_offset: 0.015
      # [choice] More than this far off the aim, turn without driving. A robot
      # that has to swing 10 deg should do it where it stands rather than
      # describe that arc at a pallet.
      max_turn_in_place: 0.17        # rad, 9.7 deg
      # [choice] D8's final-leg speed, used for the whole closing loop rather
      # than only inside the old line-up point. 3 m at 0.10 m/s is 30 s, which
      # costs demo time and nothing else.
      closing_speed: 0.10
      taper_range: 0.30              # slow down over the last 0.30 m
      range_tolerance: 0.03          # "at the standoff" window
      # [derived] How square the robot must be before the run counts as
      # arrived. It MUST be larger than the base's own turn granularity
      # (min_angular / k_heading = 0.025 rad) or the square-up never finishes.
      # 0.035 rad is 2.0 deg, against the 5 deg GO/NO-GO limit.
      arrival_yaw: 0.035
      # Hysteresis: once squaring up, do not start driving again unless the
      # face is this much further than the standoff. One noisy range reading
      # must not make the robot creep forward a frame at a time.
      resume_range: 0.10
      # [choice, 2026-10-19; lowered 2026-10-23, D75] The floor on the run-up,
      # as a FACE distance. Variable standoff with a minimum: the required
      # distance is computed from the lateral error, and never less than this.
      # Was 3.0 m, which made every run start where the pockets cannot be
      # resolved on the robot (3.35 m: about 40 points across the face at
      # pocket height). The computed term still sizes the run-up for a large
      # Nav2 error -- 3.40 m for 0.30 m of offset -- and refuses ("reposition")
      # what the 0.5 m reverse cannot reach.
      min_run_up: 2.5
      # [choice] Lateral error the run-up is sized to reach. 20 mm is a third
      # of the 65 mm of slack around a 100 mm tine in a 230 mm pocket, and
      # below the 50 mm GO/NO-GO limit with room for the measurement to be
      # wrong about it.
      residual_target: 0.020
      # Added to the computed run-up for the initial turn, during which the
      # robot travels forward without correcting much.
      run_up_margin: 0.20
      # Slack on the run-up REQUIREMENT, and the amount the reverse overshoots
      # it by. The reverse stops within its own 10 mm window and odometry path
      # length is never shorter than the displacement, so a reverse computed
      # exactly finishes a centimetre short -- and without this the robot then
      # asks for another centimetre and dies on max_backoffs having done
      # everything right. Caught by the offline harness (test_sequence.py).
      run_up_tolerance: 0.05
      # [choice, 2026-10-19] Abort after this many consecutive frames
      # of growing lateral error, provided the total growth is at least
      # min_divergence_growth.
      #
      # This was 5 frames. MEASURED by the offline harness (test_sequence.py):
      # at 5 frames and 10 mm of position noise, a 9 m run-up aborted 3 runs in
      # 12 that were working perfectly, and a 6 m one 1 in 12. Monotone growth
      # is a fragile statistic -- five strictly increasing samples happen by
      # chance once in 120 windows of white noise, and a converged robot on a
      # long run-up offers hundreds of windows. At 8 frames: none, in every
      # case tried. min_divergence_growth barely helped, because the growth
      # accumulates across the window.
      #
      # The cost is 1.6 s rather than 1.0 s to notice a real divergence, which
      # at the closing speed is 160 mm of extra travel. The detector also
      # ignores any error inside closing.residual_target now, which is where
      # the false aborts were coming from and is also where the servo stops
      # correcting anyway.
      #
      # The mechanism (N growing frames, 2026-10-19) is unchanged. If 1.6 s
      # is too slow to notice, the alternative is a model-based check -- compare the error
      # against what the servo's own decay model predicts after the distance
      # travelled -- which is robust to noise over a long baseline and would
      # catch a divergence in half the frames. That is a decision, not a tweak.
      divergence_frames: 8
      # [choice, Athreya 2026-10-23] D86: 0.010 -> 0.040. With the ZED's
      # measured depth warp (D80) the measured offset wanders 13-19 mm over 8
      # frames on its own at 2-2.5 m, and two sim runs in 10 aborted as
      # "diverging" while converging. 40 mm is clearly above that and far below
      # the ~0.25 m errors the run-up rules exist for.
      min_divergence_growth: 0.040

    # ------------------------------------------------------------- reverse
    # Backing off to make room for the run-up, and backing out after the lift.
    # Our own reverse controller with a LiDAR check, chosen over handing the
    # reverse to Nav2 (2026-10-19, D42).
    reverse:
      # [choice] D8's insertion speed, used for the reverse too. Reversing is
      # the blindest thing this robot does -- the costmap that would remember
      # what the LiDAR saw while driving past belongs to Nav2, and we chose not
      # to use it -- so it runs at the slowest speed in the stack. A 1.5 m
      # reverse then takes 30 s, which is a cost in demo time, not in safety.
      speed: 0.05
      # [choice] How far the robot may be reversed over ground NOTHING has
      # checked, on top of the ground its own body was standing on moments ago.
      # The second part is the real argument (see closing.reverse_allowance);
      # this is the admitted gap in it, kept small deliberately.
      max_unverified: 0.50
      # Rear obstacle corridor. The robot's own width plus a margin either
      # side, from the rear bumper backwards, between these heights above the
      # floor -- the floor is not an obstacle and neither is the ceiling.
      side_margin: 0.10
      min_height: 0.03
      max_height: 1.00
      # Obstacle this close to the needed reverse distance refuses the reverse.
      clearance_margin: 0.15

    frames:
      # [measured] the depth and left-image headers carry this frame.
      camera_optical: zed2_left_camera_frame_optical

      # [measured] Perception works HERE, not in base_link. base_footprint is
      # the robot's ground frame. base_link is the chassis body frame 0.235 m
      # up (the wheels mount at base_link level and lift the body), so working
      # there would put the floor at -0.235 and the pocket centres at -0.163 --
      # correct but needlessly error-prone. Here heights read as what they are.
      #
      # NOTE base_footprint is *not* exactly on the floor. Measured 2026-10-14:
      # the camera lens is 0.398 m above the floor and the URDF puts it 0.163 m
      # above base_link, so base_link is 0.235 m up -- matching the wheel
      # geometry (0.2348 m) to 0.2 mm, while base_footprint claims 0.210 m.
      # So the real floor sits at z = -0.025 in this frame. Nothing in the
      # pipeline assumes otherwise: every pallet height below is relative to
      # the *fitted* floor, which perception measures per frame.
      #
      # The URDF joint is a pure translation (xyz "0 0 -0.21", rpy "0 0 0"), so
      # base_footprint and base_link share x, y and yaw exactly. Only z differs.
      # That is why the driving targets below can be composed with the pose
      # /odom reports for base_link without any conversion.
      ground: base_footprint

      # [measured] what /odom reports: odom -> base_link at 50 Hz.
      body: base_link

      # [measured] driving targets are stored here. Never `map`: slam_toolbox
      # publishes map->odom and it jumps on loop closure.
      odom: odom
      # zed2_camera_center -> zed2_left_camera_frame is republished at 58 Hz by the
      # SDK's self-calibration, so lookups must be stamped, with a short wait.
      tf_timeout: 0.15          # s
      # [measured] the moving links in the camera chain; every other link in
      # base_footprint <- optical is on /tf_static. Perception and the overlay
      # decode only /tf messages carrying one of these (CameraTransformListener
      # in nodes/_common.py): decoding all ~200/s of /tf left their tf buffer
      # 0.15-0.4 s behind on the robot (2026-10-23) and the estimate rate fell
      # to 1.8 Hz. A link missing here fails the lookup -- no estimate.
      moving_links: [zed2_left_camera_frame]

      # [choice] false, and it must stay false for anything that drives.
      #
      # A bench workaround for a camera stamping on a different clock from
      # /tf. Measured 2026-10-15: the ZED stamped depth at 2722 s while the
      # system clock read 1792075135, with the image clock running 24.5 %
      # fast, so every stamped lookup failed with "extrapolation into the
      # past". With this true the node looks up the LATEST transform instead.
      #
      # Safe only while parked: the single moving link in the chain is the
      # ZED's stereo self-calibration, which drifts by microradians, so
      # "latest" and "at this frame" are the same number. It stops being safe
      # the moment the robot moves, because composing a pallet pose with
      # odometry needs to know when the pallet was seen -- and it makes every
      # recorded bag unreplayable. Fix the camera's clock before stage 3.
      tf_fallback_to_latest: false

      # Extrinsic correction for the camera mounting. The URDF says the optical
      # frame is level with base_footprint; measured 2026-10-14 against the
      # floor plane, it is pitched down 0.698 deg and rolled -0.516 deg, 0.868
      # deg in total. The LiDAR on the same bottom_box_link comes out level, so
      # the box is fine and the camera on it is not. Uncorrected that is 22 mm
      # of vertical error at the standoff against a 30 mm pocket-height
      # tolerance. See docs/SYSTEM.md.
      #
      # These two numbers are the MEASUREMENT, exactly as
      # tools/floor_plane_check.py prints for the camera's robot-fixed mounting
      # tilt -- the code derives the correcting rotation from them, so the sign
      # cannot be entered backwards. Re-measure after any remount:
      #
      #   python3 pallet_approach/tools/floor_plane_check.py \
      #       ~/bags/floor_cam_pose1 ~/bags/floor_cam_pose2
      #
      # Radians, per the SI convention; degrees in the comments.
      #
      # Only pitch and roll: a ground-plane observation constrains exactly three
      # of the six extrinsic degrees of freedom -- the two tilts and the height.
      # It is blind to yaw, x and y, because sliding or spinning a sensor along
      # a plane does not change what the plane looks like. The height measured
      # right already (-0.0246 m against -0.025 m from the tape, 1.7 mm apart);
      # yaw, x and y need an object at a taped position instead.
      extrinsic_correction:
        enabled: true
        measured_floor_pitch: 0.012182      # +0.698 deg
        measured_floor_roll: -0.009005      # -0.516 deg

      # The same for the LiDAR, plus its height (D74, measured 2026-10-23 on
      # 20 clouds, parked, clear floor 0.9-3 m ahead; sd 0.035 deg / 1 mm).
      # Uncorrected, its floor sat 3-4 cm above the camera's at 1-2 m, so floor
      # returns passed the 3 cm margins: the cross-check saw a "surface" 0.5 m
      # in front of every pallet face and never confirmed one. The height is
      # the floor's AFTER levelling; the correction moves it to floor_z.
      # STOPGAP until the auto-calibration routine (D74) measures it.
      lidar_correction:
        enabled: true
        measured_floor_pitch: -0.010158     # -0.582 deg
        measured_floor_roll: -0.002034      # -0.117 deg
        measured_floor_height: 0.0253       # m, levelled; floor_z is -0.025

    # BGR, by what the robot is DOING rather than one colour per state: looking
    # (grey), driving towards the pallet (amber), committed with the forks going
    # in (bright green), carrying (green), stopped because something was wrong
    # (red). Shared, not under fork_overlay, because TWO nodes draw a state in
    # this palette: fork_overlay's own panel and dashboard's HUD (D57). A node
    # block is only visible to the node it is named after, so a value that two
    # differently-named nodes must agree on has to live here or the two WILL
    # drift -- test_params.py checks both nodes declare every key.
    # The state-to-key mapping is STATE_COLOR_KEYS in dashboard.py.
    colors:
      idle: [160, 160, 160]
      detecting: [160, 160, 160]
      approaching: [0, 200, 255]
      inserting: [128, 255, 0]
      go: [0, 200, 0]
      no_go: [0, 0, 220]

    topics:
      # [measured] ros2 topic list -t on 2026-10-13. The ZED topics and /odom
      # are RELIABLE/VOLATILE, so default rclpy QoS is compatible with them and
      # there is no reason to switch to sensor-data QoS for these.
      #
      # /ouster/points is NOT: it publishes BEST_EFFORT (measured 2026-10-15).
      # A RELIABLE subscriber receives nothing from it at all. Whatever
      # subscribes to the LiDAR in stage 2 and stage 6 has to ask for
      # BEST_EFFORT. See docs/SYSTEM.md.
      depth: /zed2/zed_node/depth/depth_registered
      depth_camera_info: /zed2/zed_node/depth/camera_info
      left_image: /zed2/zed_node/rgb/color/rect/image
      left_camera_info: /zed2/zed_node/rgb/color/rect/camera_info
      odom: /odom
      # The robot PC's cloud. Only lidar_relay subscribes to it; everything
      # else reads the Jetson-local copy below, so the network carries each
      # ~3 MB cloud once instead of once per subscribing process (2026-10-22:
      # 520 Mbit/s at idle with two subscribers, odometry stalling behind it).
      lidar_source: /ouster/points            # BEST_EFFORT, see the note above
      lidar: /pallet_approach/lidar

      # Velocity commands, all geometry_msgs/Twist and NOT stamped.
      #
      # Arbitration (D3, D10, D30): nothing in this stack publishes straight at
      # the base any more. Our controller drives its own input of twist_mux,
      # the watchdog drives a higher-priority one, and twist_mux publishes the
      # winner on cmd_vel_base, which is what the scout driver subscribes to.
      # Priorities and timeouts live in config/twist_mux.yaml.
      #
      # Consequence worth knowing before a lab session: with twist_mux not
      # running, commands go nowhere and the robot never moves. The controller
      # refuses to configure in that case rather than looking busy and sitting
      # still (D31).
      cmd_vel_pallet: /cmd_vel_pallet          # our controller -> mux
      cmd_vel_safety: /cmd_vel_safety          # the watchdog's stop -> mux
      cmd_vel_base: /cmd_vel                   # mux -> the base
      # Held true at 10 Hz for the length of a run. twist_mux blocks every
      # input at or below priority 50 while it is held, which is Nav2 and
      # nothing else. It expires 0.5 s after the coordinator stops publishing
      # it, so a dead coordinator gives navigation back rather than locking the
      # robot out.
      nav_lock: /pallet_approach/nav_lock

    # The real pallet, tape-measured 2026-10-14 (D4, D19). NOT EPAL nominals --
    # the two disagree in ways that matter, and the measurement wins.
    #
    # The two faces are different STRUCTURES, not two sizes of the same thing.
    # A EUR pallet's three bottom boards run along the 1195 mm direction:
    #   - enter the 795 mm face and the forks travel BETWEEN those boards, in
    #     clear channels, so the opening starts at the floor;
    #   - enter the 1195 mm face and the forks cross them, so the opening starts
    #     above a 20 mm board.
    # That is what "four-way entry" means, and it is why every pocket number
    # below is per side rather than shared.
    pallet:
      pallet_height: 0.145           # [measured] same from either side

      # Which face we expect to meet. Perception classifies what it actually
      # sees (pallet.classify below) and uses that side's numbers; this is the
      # default when classification is off or undecided.
      entry_face: "short"

      # Shared by both sides.
      pocket_slab_half_depth: 0.06   # face slice thickness: ZED depth at ~2 m
      # [choice, Athreya 2026-10-22] D62. Each pocket's depth is the median of
      # the face-slice points within the pocket's half width plus this much
      # (the blocks either side and the deck above), and the pallet's
      # direction is the normal of the line through the two pocket centres.
      # 0.05 stays inside the narrowest block (0.10 m) on both faces.
      pocket_frame_margin: 0.05
                                     # scatters a few cm, so plane inliers miss
                                     # much of the real face (D5)
      pocket_min_points_per_bin: 2   # one stray point is not wood (D5)

      sides:
        # ------------------------------------------------- the 795 mm face
        # block 100 / pocket 230 / block 135 / pocket 230 / block 100.
        # Opening runs from the FLOOR to 0.100 -- there is no bottom board on
        # this face, which is why the old EPAL-derived 1.45 m standoff and
        # 0.052 m fork underside were both wrong here (D16, D17).
        short:
          face_width: 0.795
          depth: 1.195               # how far a fork travels once inserted
          pocket_width: 0.230
          pocket_spacing: 0.365      # centre to centre
          opening_bottom: 0.000      # the floor itself
          opening_top: 0.100
          # Band 0.035-0.075: clear of the 0.03 floor removal margin below and
          # 2.5 cm below the board edge at 0.100, which stray edge points
          # otherwise split a pocket against (D5).
          band_center: 0.055
          band_half_height: 0.020
          min_gap_width: 0.15
          max_gap_width: 0.32
          insertable: true
          insertion_stop_face_x: 0.700   # bumper gap 0.2375; LiDAR holds 2 beams
        # ------------------------------------------------ the 1195 mm face
        # block 150 / pocket 385 / block 150 / pocket 365 / block 150, over a
        # 20 mm bottom board with a 20 mm board above. The 2 cm difference
        # between the two pockets is tape-level: EPAL is symmetric by design
        # and its nominal (blocks 145, pockets 382.5) agrees to 5 mm.
        long:
          face_width: 1.195
          depth: 0.795
          pocket_width: 0.375
          pocket_spacing: 0.525
          opening_bottom: 0.020      # the bottom board
          opening_top: 0.125
          band_center: 0.0725        # centred in a 0.020-0.125 opening
          band_half_height: 0.025
          min_gap_width: 0.26
          max_gap_width: 0.50
          # [choice] D20: this pallet IS four-way entry, so refusing the long
          # side outright would model a limitation it does not have. But whether
          # a SITE allows it is policy, not geometry -- long-side entry loads the
          # 20 mm bottom boards instead of the blocks, and many warehouses
          # restrict it. Set false and CLASSIFYING returns NO-GO rather than
          # proceeding.
          insertable: true
          # Further out than the short side's stop, and not for clearance: this
          # face is only 0.795 m deep, so the short-side stop would drive the
          # tips 0.118 m out of the BACK of the pallet (D21).
          insertion_stop_face_x: 0.950   # bumper gap 0.4875; 5 LiDAR beams

      # Telling the faces apart (D22). Four things differ; these are the two
      # the pipeline measures.
      #
      # Pocket spacing is PRIMARY and face width only confirms, which is the
      # opposite of what the roadmap first assumed. Width is the weakest signal:
      # a clipped or partly occluded face measures short, and nothing then says
      # whether a 0.9 m face is a foreshortened long side or a complete short
      # one. Spacing separates the faces by 160 mm against a measured spacing
      # error of ~13 mm, and it needs only the two pocket centres perception
      # already finds.
      classify:
        # [choice, Athreya 2026-10-23] D78: off for now -- the pallet is assumed
        # to present its SHORT face (entry_face above). On the robot ~1 frame
        # in several came back "ambiguous" at 2.4-2.5 m and each one reset the
        # tracker's confirmation (D36 exempts only "unknown"). With it off,
        # perception reports entry_face and uses that side's numbers.
        enabled: false
        # One pass with a band inside BOTH openings (0.050-0.070 lies in
        # 0.000-0.100 and in 0.020-0.125) and gap limits spanning both, so the
        # pockets can be found before the side is known. The side's own band
        # and limits are then used to measure them properly.
        band_center: 0.060
        band_half_height: 0.010
        min_gap_width: 0.15
        max_gap_width: 0.50
        # A side is a candidate if the measured spacing is within this of its
        # nominal. 0.06 is under half the 0.16 m gap between the two sides, so
        # the windows cannot overlap.
        spacing_tolerance: 0.06
        # Face width confirms only, so its window is loose: occlusion and ROI
        # clipping both shorten it, and only a gross mismatch should veto.
        width_tolerance: 0.20
        # Both signals must pick the same side. Disagreement, or neither
        # matching, publishes side=AMBIGUOUS with no pockets claimed, and the
        # coordinator decides to stop (D22, decided 2026-10-15).

    # Virtual forks: a standard ITA Class II fork set. The robot has none --
    # these are what a reach truck handling EUR pallets carries. All in
    # base_footprint, x forward. Spacing and underside height are PER SIDE
    # (pallet.sides.*) because the two faces need different ones; what is here
    # is what the two faces share. See D15.
    forks:
      tine_length: 1.150        # right for a 1.195 m deep pallet
      tine_width: 0.100         # 65 mm clearance each side in a 230 mm pocket
      tine_thickness: 0.040
      # [measured] D15/D23: the carriage sits at the FRONT BUMPER, which is
      # where a real one bolts on -- the front face of base_link's collision
      # box, confirmed by tape (0.920 m bumper to bumper vs the URDF's 0.925).
      # Carriage plus tine length is the only free parameter: they never appear
      # except as their sum, the tip reach of 1.6125 m, and that sets the
      # standoff below.
      carriage_x: 0.4625

      # [choice] D27: ONE setting for both faces, not one per face.
      #
      # D21 had these per side, matching each face's pocket centres. Decided
      # 2026-10-19 that the forks keep a single spacing whichever face
      # is entered -- which is what a carriage without a hydraulic positioner
      # actually does, and it removes a way for the overlay and the insertion
      # to disagree about what the forks are.
      #
      # It only works because a single setting genuinely fits both. With a
      # 0.100 wide, 0.040 thick tine:
      #
      #   spacing must be 0.250-0.495 m   (short face 0.235-0.495, long 0.250-0.800)
      #   underside must be 0.020-0.060 m (short 0.000-0.060,       long 0.020-0.085)
      #
      # 0.365 is the measured short-side pocket spacing, so the tines sit dead
      # centre in the face we normally enter; on the long face they are 80 mm
      # inboard of the pocket centres, with 57 mm of clearance to the nearest
      # edge. 0.040 is the middle of the height window, clearing the long
      # face's 20 mm bottom board by 20 mm and the short face's board above by
      # 20 mm. Worst clearance anywhere: 20 mm.
      #
      # test_params.py checks all of that, so changing a pocket dimension
      # cannot silently make the forks stop fitting.
      spacing: 0.365
      bottom_height: 0.040

      # [choice] D44: carriage travel for the lift, NOT how far the pallet
      # rises. The tine top first takes up the slack to the top of the pocket
      # -- 0.020 m on the short face, 0.045 m on the long -- so the same 0.070
      # lifts the short face 50 mm off the floor and the long face 25 mm. Both
      # are a real pallet lift; forks.pallet_lift reports which, and the
      # coordinator puts it in the action result.
      #
      # Shared because three places need it: the simulator moves the carriage,
      # the coordinator reports the lift, and test_params checks it clears the
      # openings.
      lift_travel: 0.070

# ---------------------------------------------------------------------------
# pallet_perception (lifecycle node): depth -> pallet pose and pockets
# ---------------------------------------------------------------------------
pallet_perception:
  ros__parameters:

    use_sim_time: false

    # [measured 2026-10-15] One frame costs ~90 ms on a laptop (14 ms voxel,
    # 17 ms floor RANSAC, 37 ms DBSCAN, the rest small), so ~11 Hz there and
    # less on the Jetson. The ZED publishes depth at ~37 Hz. The node therefore
    # processes the NEWEST frame it has and drops the rest, at most this often.
    #
    # [choice] 5 Hz. The estimate is then never more than ~200 ms old, well
    # inside the 0.50 s staleness limit the watchdog uses (D9), and it leaves
    # headroom on the Jetson for the pipeline to be slower than the laptop
    # without the rate collapsing. Raising it does not make the pallet move any
    # faster; it just spends Jetson CPU re-measuring a stationary object.
    max_rate: 5.0
    # How often ~/diagnostics is published: timing, achieved rate, drops.
    diagnostics_period: 1.0

    depth:
      # [choice] ZED min_depth is 0.30 m. The far limit is provisional: a measured
      # noise curve replaces it with the range where depth is actually usable.
      min_range: 0.40
      max_range: 4.00
      # keep every Nth pixel when back-projecting. 1280x720 = 921k points;
      # stride 2 gives ~230k, which is plenty and 4x cheaper.
      stride: 2

    # Region of interest in base_footprint, applied before anything else.
    # The real floor is at z = -0.025 (measured), so -0.05 keeps the floor
    # plane in with 25 mm to spare -- RANSAC needs it -- and 0.8 m covers a
    # loaded pallet without pulling in the ceiling or the walls.
    # [choice] generous enough for a pallet at 1-4 m, tight enough to drop the
    # robot's own sensor box.
    roi:
      x_min: 0.50
      x_max: 4.00
      y_min: -1.50
      y_max: 1.50
      z_min: -0.05
      z_max: 0.80

    voxel_size: 0.02            # [choice] 2 cm, below the pocket tolerance

    # RANSAC seed. A fixed value makes a replayed bag give the same answer
    # every time, which is what makes offline debugging tractable. Set it to
    # null on the robot if you want independent draws per frame.
    seed: 0

    floor:
      ransac_distance: 0.02     # [choice] 2 cm, ~ the ZED noise at 2 m
      ransac_iterations: 200
      # Hypotheses are scored on a random subset of this many points (the
      # winner is refined on all of them). Speed only: the count just has to
      # RANK candidate planes. 0 or null scores on every point.
      score_points: 3000
      # a plane only counts as the floor if its normal is within this of vertical
      max_normal_tilt: 0.17     # rad, ~10 deg
      min_inlier_fraction: 0.25
      # Where the floor is expected, in base_footprint. Measured 2026-10-14
      # from the lens height: -0.025, i.e. base_footprint is 25 mm above the
      # real floor. Reject a fit further than max_z_error from here -- that is
      # a wall or the pallet top deck, not the floor. The tolerance covers
      # tyre compression, load and an uneven floor, not a 25 cm blunder.
      expected_z: -0.025
      max_z_error: 0.08
      # floor points are removed up to this height above the fitted plane
      removal_margin: 0.03

    cluster:
      eps: 0.05                 # [choice] DBSCAN neighbourhood, 5 cm
      # MUST stay well below the number of neighbours a point actually has.
      # After voxel_downsample the cloud is a SURFACE with points `voxel_size`
      # apart, so a disc of radius eps holds about pi*eps^2/voxel_size^2 of
      # them: 19 at eps 0.05 and voxel 0.02, and half that at the edge of a
      # face. This was 30 to begin with, which nothing could reach -- every
      # point came back as noise and there were no clusters at all.
      # test_params.py now checks the relationship, so changing voxel_size
      # cannot silently break it again.
      min_samples: 8
      # Smallest cluster that could still be a pallet. Derived, not guessed:
      # after remove_floor the front face is pallet_width x
      # (pallet_height - floor.removal_margin), which at voxel_size 0.02
      # voxelises to (0.80/0.02) x (0.114/0.02) = 228 points -- and because
      # voxelising is range-independent, that count holds anywhere inside the
      # working range. Half of it leaves room for a partly occluded or partly
      # visible face. This was 300, which rejected a cluster containing the
      # whole face. test_params.py checks it against the geometry.
      min_cluster_points: 100
      # How far a cluster's height (below) and footprint may differ from the
      # pallet's and still be accepted, as a fraction. 0.25 is loose on
      # purpose: the camera sees a partial footprint.
      size_tolerance: 0.25
      # [choice, Athreya 2026-10-23] D76. A cluster whose top is more than
      # this above pallet.pallet_height is not a pallet: EMPTY pallets only,
      # until a learned detector (or a rule for loads) replaces it. Without it
      # a partition panel standing edge-on (top 0.82 m) beat the pallet (top
      # 0.14 m) on every frame by being nearer. 4 cm covers the measured
      # pallet's top plus floor-fit and depth noise.
      max_height_above_pallet: 0.04
      # [choice, Athreya 2026-10-23] D87. Of the clusters that pass the gates,
      # perception takes the nearest one that shows two pockets, trying at most
      # this many (nearest first); if none does, the nearest, as before. Each
      # try is a face fit and a pocket search, so this bounds the extra cost.
      max_candidates: 3

    face:
      # Support the face fit must have before go_nogo will trust it. Derived,
      # then checked against real data: the fit keeps voxels within
      # face.ransac_distance (15 mm) of a vertical plane, and the real pallet's
      # front surface spans 26 mm from deck boards to blocks, so only two or
      # three voxel rows of the 0.795/0.02 = 40 columns fall inside the band.
      # Measured on pallet_2m_0deg: 139-146 inliers across five frames. This
      # was 300, which would have rejected every real estimate as a thin fit.
      # 60 is one and a half voxel rows across the full width.
      min_points: 60
      # the front face must be close to vertical to be accepted
      max_tilt_from_vertical: 0.26   # rad, ~15 deg
      ransac_distance: 0.015
      # A candidate face must point roughly at the robot. Generous, so that a
      # pallet turned 30 deg is still accepted; the inlier count is what
      # actually picks the front face over a side face.
      max_facing_angle: 1.05         # rad, 60 deg
      # [choice, Athreya 2026-10-23] D88. The face is fitted only on cluster
      # points lower than pallet_height minus this, i.e. below the top deck.
      # Seen from above, the deck is a large patch of points and a vertical
      # plane cut THROUGH it collects nearly as many as the real front face, so
      # the random draw decided which one won: on pallet_2m_0deg, seed 0 lost a
      # pocket in 4 of 30 frames with 25 mm of midpoint scatter and yaw errors
      # up to 10 deg. Below the deck: both pockets in 300/300 frames over 10
      # seeds on pallet_2m_0deg and pallet_s_129, scatter <= 4 mm, yaw p95
      # <= 3 deg. The mask is then taken over the whole cluster, as before.
      deck_margin: 0.03


# ---------------------------------------------------------------------------
# approach_controller (lifecycle node): drives to the standoff pose.
# Publishes cmd_vel ONLY while active.
# ---------------------------------------------------------------------------
approach_controller:
  ros__parameters:

    use_sim_time: false

    # [measured+choice] 0.2 m/s is the lab limit for autonomous runs. Angular is
    # a choice, deliberately low. NEVER raise either without being asked.
    limits:
      max_linear: 0.20          # m/s
      max_angular: 0.30         # rad/s
      max_linear_accel: 0.30    # m/s^2
      max_angular_accel: 0.60   # rad/s^2
      # the skid-steer base does not move below roughly these; commands smaller
      # than this are raised to it, or zeroed if the goal is already met.
      min_linear: 0.05
      min_angular: 0.10

    # The `gains` and `tolerances` blocks lived here, for the
    # rotate-drive-rotate pose controller. Both went with it (D38): the closing
    # servo's gains are under `closing` below, and the straight moves have no
    # gains at all -- they drive a distance at a speed.

    # ------------------------------------------------------------ insertion
    # The one phase where the robot drives at something it cannot fully see.
    # The pockets leave the camera at 1.17 m, 0.58 m into the travel; the LiDAR
    # holds the face for all of it (D13), which is what makes a measured stop
    # possible. Angular is exactly zero throughout (D7).
    insert:
      # [choice] D8's slowest speed, for the phase that earned it.
      speed: 0.05
      # How close to the planned stop counts as reached, for both sources.
      stop_tolerance: 0.010
      # [choice] D18: if odometry and the LiDAR disagree by more than this at
      # the moment the stop fires, abort rather than complete the insertion.
      # 50 mm against a 65 mm pocket slack: a disagreement that big means one
      # of the two is wrong, and that is not a condition to drive forward in.
      max_disagreement: 0.05
      # Longest insertion this will plan. 1.75 - 0.700 = 1.05 m is the real
      # travel on the short face; more than 1.20 m means the robot is not at a
      # standoff and the plan is being built from a bad number.
      max_travel: 1.20
      # [choice] Frames in a row with nothing measurable before the insertion
      # aborts. 5 at 10 Hz is half a second, which at 0.05 m/s is 25 mm of
      # blind travel -- a sensor hiccup, not a drive on dead reckoning. Sits
      # with the stop rule rather than with the corridor below, because it is
      # about how long to keep driving without a measurement, not about how to
      # take one.
      max_unmeasured_frames: 5
      lidar:
        # Corridor ahead. Narrow and low, so the nearest surface in it is the
        # pallet face or something standing in front of the face -- and either
        # is a reason to stop, which is why no attempt is made to tell them
        # apart. 0.20 m is just above the 0.145 m pallet.
        half_width: 0.30
        min_height: 0.03
        max_height: 0.20
        # Returns closer than this are the robot's own structure, not the world.
        min_x: 0.50
        min_points: 10
        # [choice, Athreya 2026-10-24] D90. The face is the first slice of
        # edge_bin, from the robot, with at least edge_min_returns, not the
        # 10th percentile of every return (see insertion.face_distance_ahead).
        edge_bin: 0.01
        edge_min_returns: 20

    # Commands cross the network to the robot PC, and the base driver has NO
    # command timeout (ros2 param dump /scout), so we never let the base coast on
    # a stale command: fixed publish rate while active, explicit zero on stop.
    command_rate: 20.0          # Hz
    # if no fresh target arrives within this, publish zero and report unstable
    target_timeout: 0.50        # s
    # how long to keep publishing zeros after a stop, to be sure one lands
    zero_command_repeats: 5

# ---------------------------------------------------------------------------
# coordinator: action server and state machine. Owns every decision to move.
# ---------------------------------------------------------------------------
coordinator:
  ros__parameters:

    use_sim_time: false

    action_name: pallet_task
    # ------------------------------------------------------------ timeouts
    # Each one is "how long should this phase take, plus room for it to be
    # slow", and each expiry stops the robot.
    timeouts:
      # Finding and confirming a pallet. 5 consecutive frames at 5 Hz is one
      # second, so 10 s allows nine failed attempts before giving up.
      confirm: 10.0
      # No CONFIRMED track for this long, in any state where the pallet should
      # still be visible, aborts. Not applied during the insertion and after:
      # the pockets leave the camera's view by design (D16), so losing the
      # track there is expected rather than a fault.
      # [choice, Athreya 2026-10-23] D79: 1.0 -> 2.5 s. Re-confirming needs
      # tracker.confirm_frames (5) consecutive frames, ~1.5 s at the ~3.3 Hz
      # perception achieves on the robot, so at 1.0 s one rejected frame while
      # driving could never be recovered: three runs aborted that way, during
      # a reverse and while turning. At 0.10 m/s, 2.5 s is 0.25 m driven on
      # the last confirmed track.
      lost_pallet: 2.5
      # The forks take (0.150 - 0.040) / 0.05 = 2.2 s to lower and 1.4 s to
      # lift. 10 s is room for a simulator running slowly, not for one that
      # has stopped.
      forks: 10.0
      # The whole run. A 5 m run-up at 0.10 m/s is 50 s, plus 21 s of
      # insertion and back-out at 0.05 m/s, plus the confirm and the checks:
      # about 90 s at worst. 240 s is generous and still bounded -- an
      # unbounded run is one nobody is watching.
      run: 240.0

    checking:
      settle_time: 0.5          # s stopped before evaluating the rules
      frames: 5                 # confirmed frames the rules are evaluated over

    # --------------------------------------------------------------- retries
    # [choice, 2026-10-19] "Back off and run the loop again, once."
    max_retries: 1
    # [choice, Athreya 2026-10-23] D89. There is no reverse before an
    # approach any more; the only reverse is a retry after a retryable NO-GO.
    # It backs up at least min_retry_backoff with perception running, then
    # until the last retry_stable_frames confirmed pocket midpoints (in odom)
    # lie within retry_stable_spread of their mean -- the GO/NO-GO stability
    # limit -- and never further than the run has covered (distance driven
    # forward + reverse.max_unverified, D42). Then it approaches again.
    min_retry_backoff: 1.00
    retry_stable_frames: 5
    retry_stable_spread: 0.03

    # [choice] D12: refuse a goal if the stack is unhealthy when it arrives,
    # naming the failing source. A run that starts unhealthy fails later and
    # more expensively, next to a pallet. Set false only for bench work with no
    # watchdog running -- and then nothing is watching the sensors.
    require_healthy_to_start: true

    # Which GO/NO-GO failures another approach could change. Only the ones
    # about where the robot is standing and how steady the estimate is;
    # everything else is a property of the pallet, and driving the same
    # approach again would measure the same pallet.
    #
    #   yaw, lateral_offset   where the robot ended up -- retry
    #   stability             the estimate was unsteady -- retry
    #   pocket_dimensions     the pockets are the wrong size -- do not
    #   pocket_count          a pocket was not found -- do not
    #   face_quality          the fit had no support -- do not
    #   overhang              the load overhangs the face -- do not
    #   pocket_clearance      something is in the pocket -- do not
    retryable_checks: ["yaw", "lateral_offset", "stability"]

    # GO/NO-GO thresholds. Conservative by default: a false GO is far worse
    # than a false NO-GO, so every limit here errs towards NO-GO.
    go_nogo:
      # [derived] the face fit's own support. face.min_points is what
      # perception needs to accept a fit at all; this is what GO/NO-GO needs
      # to trust one. Same number for now, raised here rather than there if
      # the evaluation shows thin fits passing.
      min_face_inliers: 60

      max_yaw_error: 0.087        # rad, 5 deg at the standoff
      max_lateral_offset: 0.050   # m from the pocket centre line
      pocket_width_tolerance: 0.040
      pocket_height_tolerance: 0.030
      min_pocket_count: 2
      # a load point this far in front of the fitted face counts as overhang
      overhang_margin: 0.020
      # [choice, Athreya 2026-10-22] D61. OFF for now: nothing is assumed to
      # stick out of the pallet. The rule as written fires on any single
      # point beyond the margin, and 1 cm of depth noise put 77 of the pallet's
      # own deck points 20-44 mm out in the sim. Every GO says the overhang was
      # not checked. Before switching it back on, make it robust to noise
      # (e.g. per-strip medians across the face, discussed 2026-10-22).
      check_overhang: false
      # clear volume that must be empty in front of each pocket
      pocket_clearance_depth: 0.10
      # [choice, Athreya 2026-10-22] D63. OFF for now: the pocket approaches
      # are assumed clear. The rule fires on any single point in a box that
      # starts 1-2 mm in front of the face with its sides on the block edges,
      # and depth noise put 1-5 block-edge points 8-44 mm out in 10 of 10 sim
      # runs. Every GO says it was not checked. Before switching it back on,
      # make it robust (e.g. start the box 3 cm out, inset its sides 2 cm,
      # and require at least 10 points, discussed 2026-10-22).
      check_pocket_clearance: false
      # stability over the last N accepted frames
      stability_frames: 5
      max_position_spread: 0.030  # m
      max_yaw_spread: 0.035       # rad, ~2 deg

# ---------------------------------------------------------------------------
# fork_overlay: draws the virtual forks and detected pockets on the left image.
# ---------------------------------------------------------------------------
fork_overlay:
  ros__parameters:

    use_sim_time: false
    # [choice] 5 Hz and 640x360, and NOT a preference. Measured 2026-10-13: one
    # subscriber to a raw ZED image topic from the main PC dropped the whole
    # ZED node to ~0.2 Hz, and even compressed full-rate images were unusable
    # remotely. So the one image this stack publishes is downscaled and
    # low-rate (docs/SYSTEM.md, the network rule). Since 2026-10-22 the frame
    # is shrunk FIRST and drawn at the debug size with the intrinsics scaled
    # (1.1 ms instead of 7.3 ms a frame); test_fork_overlay.py checks the forks
    # land on exactly half the full-resolution pixels, which is the factor of
    # two the old full-resolution render was guarding against.
    #
    # [choice, Athreya 2026-10-22] 26 fps for the browser dashboard (asked for
    # at least 24). 26 rather than 25 because the schedule runs on the node's
    # clock: in the Gazebo sim at a real-time factor of 0.95, 25 came out as
    # 23.7 fps in the browser (measured on the GPU machine). Decimated on a schedule (rate_limit.Schedule): from the
    # ZED's ~37 Hz a "time since the last frame" gate could only give 18.5.
    # Video only: nothing that drives reads this image.
    publish_rate: 26.0          # Hz
    debug_width: 640
    debug_height: 360
    # floor_z moved to the shared block above: the overlay, the tracker and the
    # insertion controller all measure from it, and it is one measurement of
    # one robot. It still matters most here -- at the standoff there is almost
    # no floor left in frame to fit to (docs/SYSTEM.md), so the overlay's forks
    # are built against this constant rather than a fit (D29).
    alpha: 0.45                 # fill transparency
    line_thickness: 2
    draw_pockets: true
    draw_standoff_marker: true
# ---------------------------------------------------------------------------
# dashboard: composites fork_overlay's image with a HUD of everything that is
# NOT face geometry -- health, the tracker, the controller, the forks, why.
# Publishes /dashboard/image, which video_stream.launch.py streams to a
# browser over WebRTC (D57). See dashboard.py for the layout.
# ---------------------------------------------------------------------------
dashboard:
  ros__parameters:

    use_sim_time: false

    # [choice] The dashboard publishes one frame per fork_overlay frame (so at
    # its 25 fps). This timer is the FALLBACK: when no overlay frame has come
    # for two periods it keeps the HUD panel updating and shows the image
    # going stale, or the "no camera" placeholder -- see stale_after.image.
    publish_rate: 5.0

    # [choice] Used only until the first fork_overlay frame arrives, or if it
    # stops arriving entirely -- the placeholder is drawn at this size so the
    # output frame is the same size whether or not a camera image has ever
    # existed. Matches fork_overlay.debug_width/debug_height; kept as a
    # separate pair here (not read from the fork_overlay block) because this
    # node has no reason to depend on that one's parameters existing.
    placeholder_size: [640, 360]

    # [choice] How long each source may go quiet before the HUD stops trusting
    # its colour and fades the value to grey (dashboard.py's `_stale`).
    # Roughly 3-5x each source's own publish period, the same reasoning as the
    # watchdog's own staleness limits (D9) applied to a HUD instead of a
    # safety stop: long enough that one missed message does not flicker the
    # display, short enough that a genuinely dead source goes grey inside a
    # couple of seconds rather than sitting there looking current.
    stale_after:
      image: 1.0           # fork_overlay publishes at 5 Hz
      coordinator: 1.0      # /coordinator/status publishes at 20 Hz
      health: 1.5           # /health publishes at 2 Hz
      tracked: 1.0           # /pallet_tracker/tracked publishes at perception's 5 Hz
      controller: 0.5        # /approach_controller/status publishes at 20 Hz,
                             # but it is a LIFECYCLE publisher and only
                             # delivers while the controller is active; outside
                             # the four driving states it goes stale on
                             # purpose, which is the correct thing to show
      forks: 1.0             # /virtual_forks/state publishes at 10 Hz

    # Panel geometry. The widget grid and the reason strip below the image are
    # sized from these three numbers alone (dashboard.frame_size), never from
    # how much text a frame happens to have -- so the published image size
    # never changes frame to frame. test_dashboard.py checks the checked-in
    # defaults here against video_stream.launch.py's declared stream height.
    pad: 8
    line_height: 15
    font_scale: 0.40

# ---------------------------------------------------------------------------
# watchdog: measures whether the stack is healthy, and stops the robot when it
# is not. Independent of the coordinator on purpose -- a coordinator that has
# wedged still ends up with a stationary robot (D9, D12, D32).
# ---------------------------------------------------------------------------
watchdog:
  ros__parameters:

    use_sim_time: false

    publish_rate: 2.0           # Hz, /health and /diagnostics
    # Matches approach_controller.command_rate. The safety stop has to arrive
    # at least as often as the command it is overriding, or the mux alternates
    # between them.
    command_rate: 20.0
    # Window the per-source rate is measured over. 2 s holds ~10 samples of the
    # slowest source we check (the LiDAR at 10 Hz), which is enough to tell
    # 5 Hz from 10 Hz.
    window: 2.0

    # [choice] D9's staleness limits, each about five missed messages at the
    # measured rate. At the 0.20 m/s lab limit the robot travels under 60 mm
    # before one of these fires.
    #
    # The rate floors are a second, independent check, and they are derived
    # from what the pipeline CONSUMES rather than from what the sensor
    # nominally produces: depth arrives at ~37 Hz and perception looks at 5 of
    # them (D24), so a camera at 12 Hz is fine and one at 2 Hz is not. Setting
    # these at the nominal rate would abort runs over a sensor hiccup that
    # costs the pipeline nothing.
    max_age:
      # The camera's liveness comes from depth/camera_info, not from the depth
      # image: same publisher, same callback, same rate, a few dozen bytes
      # instead of 3.7 MB. Nothing in this node ever subscribes to an image.
      camera_info: 0.30         # ~37 Hz nominal
      # [choice, Athreya 2026-10-23] D85: 0.50 -> 1.00. Perception reaches
      # ~3.3 Hz on the robot, so one slow frame leaves the newest estimate
      # 0.6-0.9 s old and a 0.50 limit aborted a sim run on exactly that.
      # Three frame periods; 10 cm at the closing speed.
      estimate: 1.00
      # [measured 2026-10-22, D72] Raised from D9's 0.20 / 0.50 after
      # measuring the robot for 30 s at idle (clocks synced to 0.5 ms, so this
      # is real lateness, not skew). LiDAR: every cloud arrives ~0.37 s old
      # (p99 0.42 s), so 0.50 left under 0.1 s of margin; 0.80 allows about
      # three missed scans more. Odom: normally 4 ms old, but the stream stalls
      # for up to ~1 s now and then; 0.50 covers ordinary jitter and still
      # stops the robot on a real stall (open: find the stall's cause).
      odom: 0.50                # 50 Hz nominal
      lidar: 0.80               # 10 Hz nominal, ~0.37 s built-in latency
      # The tf chain's camera link is republished at 58 Hz by the ZED SDK's
      # stereo self-calibration, on the CAMERA's clock. So this is the check
      # that catches clock skew between the Jetson and the camera -- the
      # failure that cost an evening on 2026-10-15 and the reason
      # tools/clock_audit.py exists. It is measured but NOT enforced while
      # frames.tf_fallback_to_latest is true, and the node says so in a warning
      # at startup.
      # [measured 2026-10-22, D72] 0.30 -> 0.50: worst 0.16 s at idle, but
      # 0.35 s the moment perception starts up (a CPU spike on the Jetson).
      tf: 0.50

    # [choice, 2026-10-20] D58. How long after a run starts perception
    # may stay silent before its first estimate. Perception is activated by
    # the run and needs a frame plus processing before it says anything, and
    # this node judges at 2 Hz, so without it a run aborted whenever the first
    # judgement came first (2 runs in 4 in the Gazebo sim). Only covers the
    # FIRST estimate: after that max_age.estimate applies as before. The robot
    # does not drive before a confirmed track, so the grace never covers motion.
    first_estimate_grace: 2.0   # s

    # [choice, Athreya 2026-10-22] D64. The coordinator states in which
    # perception's estimate must be fresh: the ones that use the camera. From
    # LOWERING on, the pockets are out of the camera's view (D16) and the
    # insertion runs on odometry with the LiDAR stop, which stay required in
    # every state. Required everywhere, it aborted 5 of 5 sim pickups ~0.5 m
    # into the insertion.
    estimate_required_states: [CONFIRMING, CLASSIFYING, BACKING_OFF, CLOSING, CHECKING]

    min_rate:
      camera_info: 10.0         # twice what perception consumes
      estimate: 2.5             # half the 5 Hz target
      odom: 20.0
      lidar: 5.0

# ---------------------------------------------------------------------------
# pallet_tracker: is this the same pallet, frame after frame? (D34-D36)
# Perception has no memory; this node is the memory, and the coordinator will
# not move the robot until it says CONFIRMED.
# ---------------------------------------------------------------------------
pallet_tracker:
  ros__parameters:

    use_sim_time: false

    # [choice] Frames the confidence is measured over. 10 at perception's 5 Hz
    # (D24) is two seconds, so the confidence reacts inside the 1.0 s
    # lost-pallet timeout rather than lagging it.
    window: 10
    # Below this many offered frames the confidence reports 0.0 rather than a
    # fraction of one or two frames. One accepted frame out of one offered is
    # not 100 % confidence, it is no evidence.
    min_window_frames: 5

    # [choice] Consecutive accepted frames before the track counts as
    # confirmed. Same number as the old detecting.confirm_frames, and for the
    # same reason: one lucky frame must never start the robot moving.
    confirm_frames: 5
    min_confidence: 0.6

    # How far an estimate may sit from the track and still be the same pallet.
    # Measured IN ODOM, with the robot's motion between frames taken out, so
    # these are measurement error and not travel: at 0.10 m/s and 5 Hz the
    # robot moves 20 mm between frames, and this would otherwise have to
    # swallow that.
    #
    # 0.15 m is the same gate the coordinator used for its outlier rejection
    # and is about ten times the ~13 mm spacing error measured on real bags.
    max_jump: 0.15            # m
    max_turn: 0.20            # rad, ~11 deg
    # A pallet does not turn over between two frames 200 ms apart, so a side
    # that changes means one of the two classifications is wrong -- and which
    # one is not knowable from here, so neither is trusted (D36).
    require_same_side: true

    # How close an odometry sample must be to the frame's stamp to be used as
    # the robot's pose for it. /odom runs at 50 Hz so the nearest sample is
    # within 10 ms -- 1 mm at the closing speed. A frame with nothing this
    # close is rejected with that as the reason rather than tracked against the
    # wrong pose: the whole argument for comparing positions in odom is that
    # the robot's motion has been taken out, and taking it out at the wrong
    # instant undoes that silently.
    odom_match_tolerance: 0.05        # s

    # [choice, Athreya 2026-10-20] D59. The pallet does not move, so its pose
    # in odom is AVERAGED over frames, and the closing loop steers onto that
    # average rather than onto the newest frame. Measured in the Gazebo sim:
    # one frame's face normal wobbles by +-0.04 rad, which at 3 m swings the
    # pocket centre line by +-120 mm, and the robot steered after it (angular
    # command saturated and flipped sign 20 times in a 20 s approach).
    #
    # Each frame is weighted by 1 / range^2, because the normal's error moves
    # the line by range x angle: a frame at 1.75 m counts three times as much
    # as one at 3 m. That keeps D34's point -- the measurement improves as the
    # robot closes in -- without its lag, which came from averaging poses that
    # were relative to a moving robot.
    #
    # memory: each older frame's weight is multiplied by this per new frame,
    # so the average is over ~1 / (1 - memory) = 20 frames, 4 s at 5 Hz. It is
    # bounded so that odometry drift (skid steer scrubs when turning) cannot
    # accumulate into the average for a whole run.
    fusion_memory: 0.95
    # Ranges below this are weighted as if at this range, so one very close
    # frame cannot take over the average.
    fusion_min_range: 0.5             # m

    # LiDAR cross-check (D13 measured that the Ouster sees the face). The
    # camera's plane is the reference and the LiDAR is asked about it; fitting
    # a second plane would need its own correspondence argument.
    lidar:
      # How far in front of and behind the camera's plane to look, metres.
      # Asymmetric on purpose.
      #
      # BEHIND separates "the face is not where the camera says" from "that is
      # a different object". A disagreement larger than this empties the window
      # and reads as NOT EVALUATED, which is honest: nothing in view is the
      # face. An error that gross is caught by the cluster size and ROI checks.
      #
      # AHEAD keeps the robot's own structure out of the statistic. At the
      # 1.75 m standoff, 0.60 m in front of the face plane is still 1.15 m
      # ahead of base_footprint -- well clear of the 0.4625 m bumper. Anything
      # the LiDAR does see in there is an obstacle between us and the pallet,
      # and reporting that as a disagreement is correct.
      search_ahead: 0.60
      search_behind: 1.00
      # Ceiling on the window's half-width along the face, used only when
      # perception reports no face width. Normally the window is half the
      # MEASURED width plus 50 mm, so that whatever stands behind the pallet is
      # occluded by the pallet across the whole window -- which is what lets
      # the nearest-surface statistic be about the face.
      half_width: 0.70
      # The lower bound is the one that matters. Without it the floor
      # immediately in front of the face falls in the window, and floor points
      # lie almost exactly on a vertical plane's extension -- the check would
      # then pass on bare ground every time. Same 0.03 m as
      # pallet_perception.floor.removal_margin.
      floor_margin: 0.03
      height_margin: 0.05
      # [choice, UNVERIFIED ON REAL DATA] Below this many returns the check
      # reports NOT EVALUATED, which is not agreement. The arithmetic says
      # 1-2 beams by ~44 azimuth columns at 3 m and 2-3 by ~75 at the standoff,
      # so 20 should be reachable throughout -- but that is geometry, not a
      # measurement. The tier-1 bags carry /ouster/points; the achieved counts
      # go in docs/dataset.md and this number is set from them.
      min_points: 20
      # How far the LiDAR median may sit from the camera's plane. Loose on
      # purpose: this is a sanity check against the camera fitting a plane that
      # is not there, not a calibration. The LiDAR's own URDF chain is 41 mm
      # out (D23-adjacent, docs/SYSTEM.md), so a tight limit here would be
      # measuring our own extrinsics.
      max_offset: 0.10
      # A cloud further than this from the estimate's stamp is treated as no
      # LiDAR at all. At 10 Hz the newest cloud is normally within 100 ms,
      # which is 10 mm of travel at the closing speed; 0.30 s would be 30 mm,
      # still well inside max_offset, and beyond that the comparison is between
      # two different moments.
      max_cloud_age: 0.30             # s

# ---------------------------------------------------------------------------
# virtual_forks: the carriage this robot does not have (D43).
# Heights are of the tine UNDERSIDE above the floor -- the same quantity as
# forks.bottom_height, which is what the overlay draws.
# ---------------------------------------------------------------------------
virtual_forks:
  ros__parameters:

    use_sim_time: false

    publish_rate: 10.0
    # [choice] Travel height. Clear of a 0.03 m floor-removal margin and of
    # anything the robot would drive over in a lab, and visibly different from
    # the insertion height so the overlay shows the lowering happen.
    park_height: 0.150
    # The insertion height and the lift travel are forks.bottom_height and
    # forks.lift_travel in the shared block. This node had its own copies; two
    # numbers for one height is how an overlay and a simulator come to
    # disagree about where the forks are.
    # [choice] Vertical speed. A real reach truck is faster; slow enough to see
    # on the overlay is the more useful property here, and nothing waits on it
    # except the sequence's own timeout.
    speed: 0.05
