# Applied ON TOP of params.yaml when the stack runs against the Gazebo sim
# (sim/run_sim.sh passes overlay_params:=<this file>). Everything not listed
# here is the robot's own value -- the point of the sim is to run the real
# configuration, so this file stays as short as it can.
#
# Only three things are genuinely different in the sim:
#
# 1. Time comes from Gazebo's /clock. Every node block in params.yaml pins
#    use_sim_time: false, and a node block beats /**, so it is overridden here
#    per node rather than once. test_params.py checks this list matches the
#    node blocks in params.yaml, so a node added later cannot run on wall time
#    against sim-time stamps.
#
# 2. The simulated camera is mounted exactly as the URDF says. The real one is
#    pitched 0.698 deg and rolled -0.516 deg (measured, docs/SYSTEM.md), and
#    params.yaml corrects for that. Applied here it would tilt a camera that is
#    not tilted by the same amount the other way.
/**:
  ros__parameters:
    use_sim_time: true
    frames:
      extrinsic_correction:
        enabled: false
      # The sim's LiDAR is mounted exactly where the URDF says (D74).
      lidar_correction:
        enabled: false
      # 3. Sim plumbing is slower than the ZED's. The camera's dynamic tf link
      #    is relayed per frame by a Python node (sim/.../camera_tf.py), and on
      #    a loaded laptop it reached perception's buffer more than 0.15 s after
      #    the image: 18 % of frames were dropped as "extrapolation into the
      #    future" (measured 2026-10-22). Waiting longer for it costs nothing on
      #    the frames that would have succeeded anyway.
      tf_timeout: 0.5

pallet_perception:
  ros__parameters:
    use_sim_time: true
    # D82 capped perception at 3.3 Hz here; removed 2026-10-26 (D92), so the
    # sim runs perception at params.yaml's max_rate.
approach_controller:
  ros__parameters:
    use_sim_time: true
coordinator:
  ros__parameters:
    use_sim_time: true
    # D91: the sim's forklift really lifts the pallet, so it backs out.
    backout:
      enabled: true
fork_overlay:
  ros__parameters:
    use_sim_time: true
dashboard:
  ros__parameters:
    use_sim_time: true
watchdog:
  ros__parameters:
    use_sim_time: true
pallet_tracker:
  ros__parameters:
    use_sim_time: true
virtual_forks:
  ros__parameters:
    use_sim_time: true
